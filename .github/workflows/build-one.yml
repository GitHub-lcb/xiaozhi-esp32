name: Build One Board

# Fork helper: build exactly one board variant and keep the firmware as a
# downloadable artifact. No tag, no release, no release manifest.
#
# Runs automatically on every push to main that touches firmware inputs, and on
# demand for any other board/variant. The auto run always builds the defaults
# below; workflow_dispatch overrides them.

on:
  workflow_dispatch:
    inputs:
      board:
        description: Board directory under main/boards, for example bread-compact-wifi
        type: string
        required: true
        default: bread-compact-wifi
      name:
        description: Variant name from that board config.json builds[].name
        type: string
        required: true
        default: bread-compact-wifi
      language:
        description: UI locale such as zh-CN or en-US; empty keeps the build default
        type: string
        required: false
        default: zh-CN
      wake_word:
        description: Wake-word model or alias (nihaoxiaozhi, wn9_xxx, disabled); empty derives it from the language
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'main/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults*'
      - 'partitions/**'
      - 'scripts/**'
      - '.github/workflows/build-one.yml'

permissions:
  contents: read

# A newer push supersedes the in-flight build for the same branch.
concurrency:
  group: build-one-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.name || 'bread-compact-wifi' }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build single variant
        shell: bash
        env:
          BOARD: ${{ inputs.board }}
          VARIANT: ${{ inputs.name }}
          LANGUAGE: ${{ inputs.language }}
          WAKE_WORD: ${{ inputs.wake_word }}
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          # workflow_dispatch supplies the values; a push run falls back to the
          # fork's own board so the firmware is rebuilt without any clicking.
          BOARD="${BOARD:-bread-compact-wifi}"
          VARIANT="${VARIANT:-bread-compact-wifi}"
          LANGUAGE="${LANGUAGE:-zh-CN}"
          echo "board=$BOARD variant=$VARIANT language=$LANGUAGE wake_word=$WAKE_WORD"
          OPTIONS=()
          if [[ -n "$LANGUAGE" ]]; then OPTIONS+=(--language "$LANGUAGE"); fi
          if [[ -n "$WAKE_WORD" ]]; then OPTIONS+=(--wake-word "$WAKE_WORD"); fi
          python scripts/build.py "$BOARD" --name "$VARIANT" "${OPTIONS[@]}"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_${{ inputs.name || 'bread-compact-wifi' }}_${{ github.sha }}
          path: |
            build/merged-binary.bin
            build/xiaozhi.bin
          if-no-files-found: error
          overwrite: true
